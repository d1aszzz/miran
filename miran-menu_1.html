      { n: "Куырдак", note: "фирменное блюдо, баранина", p: 4800 },
      { n: "Туркестан", note: "нежные бараньи рёбрышки по-восточному", p: 3750 },
      { n: "Тай куырдак", note: "фирменное блюдо, конина", p: 4200 },
      { n: "Мясо по-тайски", note: "томлёная говядина с овощами и специями, на жаровне", p: 3000 },
    ]},
    { cat: "Вторые блюда", items: [
      { n: "Ташкентский плов", note: "плов из говядины с изюмом, казы и перепелиным яйцом", p: 2400 },
      { n: "Праздничный плов", note: "плов с бараниной, подаётся с казы и чесноком", p: 2400 },
    ]},
    { cat: "Супы", items: [
      { n: "Рамен с пельменями", p: 2750 },
      { n: "Рамен с креветками", p: 2950 },
      { n: "Рамен с курицей", p: 2850 },
      { n: "Кебаб шорпа", note: "хит · новинка", p: 2600 },
      { n: "Сорпа", note: "восточный бульон из молодого ягнёнка с овощами и зеленью", p: 2300 },
      { n: "Латман узбекский", note: "наваристый бульон с ручной лапшой", p: 2500 },
      { n: "Латман уйгурский", note: "лапша ручного приготовления с бульоном «Ваджу»", p: 2500 },
      { n: "Перепелиный суп", note: "лёгкий суп из перепёлки с овощами", p: 2400 },
      { n: "Мампар", note: "суп с овощами, мясом, кусочками теста и яйцом", p: 2150 },
      { n: "Домашняя лапша с фрикадельками", p: 2400 },
      { n: "Чучвара", note: "суп с домашними пельменями", p: 2400 },
      { n: "Мастава", note: "восточный рисовый суп", p: 2300 },
      { n: "Машхорда", note: "наваристый суп с рисом и машем", p: 2300 },
      { n: "Окрошка", note: "холодный суп с овощами и копчёной колбасой", p: 2000 },
    ]},
    { cat: "Роллы и азиатская кухня", items: [
      { n: "Киллаб с сёмгой", p: 2800 },
      { n: "Киллаб с говядиной", p: 2700 },
      { n: "Фаршированный перец", note: "острые перцы, фаршированные мясом, обжаренные в кляре", p: 2400 },
      { n: "Кукси", note: "блюдо корейской кухни, подаётся холодным или горячим", p: 2400 },
    ]},
    { cat: "Хе", items: [
      { n: "Хе из огурцов", p: 2500 },
      { n: "Хе из грибов", p: 2800 },
      { n: "Хе из говядины", p: 3250 },
      { n: "Хе из рыбы", p: 2650 },
      { n: "Хе из бараньих рёбрышек", p: 2950 },
    ]},
    { cat: "Салаты", items: [
      { n: "Дамди", note: "телятина, грибы, брокколи, черри в соусе на основе сои", p: 3450 },
      { n: "Монако", note: "айсберг, сёмга, творожный сыр, черри, оливки", p: 3500 },
      { n: "Цезарь с курицей", note: "айсберг, курица, черри, сухари, соус цезарь, пармезан", p: 3800 },
      { n: "Европа", note: "лист салата, куриная грудка, кукуруза, сухарики, майонез", p: 2500 },
      { n: "Грузия", note: "листья салата, помидоры, огурцы, перец, хрустящие баклажаны", p: 3200 },
      { n: "Греческий", note: "листья салата, томаты, огурцы, сыр фетакса, оливки", p: 3350 },
      { n: "Ситора", note: "куриное филе, яйцо, кукуруза, огурцы, колбаса, говяжий язык", p: 2750 },
      { n: "Ляззат", note: "хрустящие баклажаны в кляре с томатами в авторском соусе", p: 3750 },
      { n: "Анхор", note: "томаты, отварная курица, сухарики, тёртый сыр, майонез", p: 2700 },
      { n: "Оливье", p: 2200 },
      { n: "Ачичук", note: "сочные томаты с луком и острым перчиком", p: 2000 },
      { n: "Свежий", note: "заправляется по желанию маслом, майонезом или зеленью", p: 2100 },
      { n: "Малика", note: "телятина, капуста, огурцы, яйцо, картофель пай, майонез", p: 2650 },
      { n: "Сезам", note: "зелень, томаты, огурцы, сыр фетакса, грецкие орехи", p: 2600 },
      { n: "Микс салат с курицей", p: 3150 },
      { n: "Микс салат с говядиной", p: 3300 },
    ]},
  ];

  // give every item a stable id
  MENU.forEach((c, ci) => c.items.forEach((it, ii) => it.id = ci + "-" + ii));

  const fmt = (n) => n.toLocaleString("ru-RU");
  const KEY_PREFIX = "order:";

  // ---------------- STATE ----------------
  let mode = "customer";           // customer | waiter
  let activeCat = MENU[0].cat;
  let query = "";
  let cart = {};                   // id -> qty
  let table = "";
  let screen = "menu";             // menu | cart | confirm
  let lastOrder = null;
  let toast = null;

  let waiterCode = "";
  let waiterOrder = null;
  let waiterError = "";
  let scanning = false;
  let scanStatus = "";

  const root = document.getElementById("miran-root");

  function showToast(msg) {
    toast = msg;
    render();
    setTimeout(() => { toast = null; render(); }, 1800);
  }

  function findItem(id) {
    for (const c of MENU) for (const it of c.items) if (it.id === id) return it;
    return null;
  }

  function cartCount() {
    return Object.values(cart).reduce((a, b) => a + b, 0);
  }
  function cartTotal() {
    let t = 0;
    for (const id in cart) { const it = findItem(id); if (it) t += it.p * cart[id]; }
    return t;
  }
  function addItem(id) { cart[id] = (cart[id] || 0) + 1; render(); }
  function removeItem(id) {
    if (!cart[id]) return;
    cart[id] -= 1;
    if (cart[id] <= 0) delete cart[id];
    render();
  }

  function genCode() {
    const chars = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
    let s = "";
    for (let i = 0; i < 5; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return s;
  }

  async function submitOrder() {
    const items = Object.keys(cart).map(id => {
      const it = findItem(id);
      return { n: it.n, p: it.p, qty: cart[id] };
    });
    if (!items.length) return;

    const code = genCode();
    const order = {
      code,
      table: table.trim() || "—",
      items,
      total: cartTotal(),
      createdAt: new Date().toISOString(),
      status: "Принят"
    };

    try {
      await window.storage.set(KEY_PREFIX + code, JSON.stringify(order), true);
      await pushToIndex(order);
    } catch (e) {
      console.error("storage error", e);
      showToast("Не удалось сохранить заказ, попробуйте ещё раз");
      return;
    }

    lastOrder = order;
    cart = {};
    screen = "confirm";
    render();
    setTimeout(renderQR, 30);
  }

  const INDEX_KEY = "orders:index";
  async function pushToIndex(order) {
    let list = [];
    try {
      const res = await window.storage.get(INDEX_KEY, true);
      if (res && res.value) list = JSON.parse(res.value);
    } catch (e) { list = []; }
    list.unshift({ code: order.code, table: order.table, total: order.total, createdAt: order.createdAt });
    if (list.length > 100) list = list.slice(0, 100);
    try { await window.storage.set(INDEX_KEY, JSON.stringify(list), true); } catch (e) { console.error(e); }
  }

  function renderQR() {
    const el = root.querySelector("#qr-target");
    if (!el || !window.QRCode) return;
    el.innerHTML = "";
    new QRCode(el, {
      text: "MIRAN-ORDER:" + lastOrder.code,
      width: 168,
      height: 168,
      colorDark: "#211609",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });
  }

  async function lookupOrder(rawCode) {
    const code = (rawCode || "").trim().toUpperCase().replace(/^MIRAN-ORDER:/, "");
    if (!code) return;
    waiterError = "";
    try {
      const res = await window.storage.get(KEY_PREFIX + code, true);
      if (res && res.value) {
        waiterOrder = JSON.parse(res.value);
      } else {
        waiterOrder = null;
        waiterError = "Заказ с таким кодом не найден";
      }
    } catch (e) {
      waiterOrder = null;
      waiterError = "Заказ с таким кодом не найден";
    }
    render();
  }

  // ---------------- CAMERA SCAN (waiter) ----------------
  let videoStream = null;
  async function startScan() {
    scanning = true;
    scanStatus = "Запрашиваем доступ к камере…";
    render();
    try {
      videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    } catch (e) {
      scanStatus = "Камера недоступна — введите код вручную";
      scanning = false;
      render();
      return;
    }
    const video = root.querySelector("#scan-video");
    if (!video) return;
    video.srcObject = videoStream;
    video.play();
    scanStatus = "Наведите камеру на QR-код клиента";
    render();
    requestAnimationFrame(tickScan);
  }
  function stopScan() {
    scanning = false;
    if (videoStream) { videoStream.getTracks().forEach(t => t.stop()); videoStream = null; }
  }
  function tickScan() {
    if (!scanning) return;
    const video = root.querySelector("#scan-video");
    const canvas = root.querySelector("#scan-canvas");
    if (!video || !canvas || video.readyState !== video.HAVE_ENOUGH_DATA) {
      requestAnimationFrame(tickScan);
      return;
    }
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const result = window.jsQR ? jsQR(imgData.data, imgData.width, imgData.height) : null;
    if (result && result.data && result.data.indexOf("MIRAN-ORDER:") === 0) {
      stopScan();
      lookupOrder(result.data);
      return;
    }
    requestAnimationFrame(tickScan);
  }

  // ---------------- RENDER ----------------
  function esc(s) {
    return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function render() {
    if (mode === "customer") renderCustomer();
    else renderWaiter();
  }

  function renderCustomer() {
    let overlay = "";
    if (screen === "cart") overlay = cartOverlayHTML();
    if (screen === "confirm") overlay = confirmOverlayHTML();

    root.innerHTML = `
      <div class="app-shell" style="position:relative;">
        <div class="topbar">
          <div class="brand">
            <div class="name">Miran</div>
            <div class="tag">Меню у стола</div>
          </div>
          ${roleSwitchHTML()}
        </div>
        <div class="subbar">
          <input type="search" id="search-input" placeholder="Найти блюдо…" value="${esc(query)}" />
          <input type="text" class="table-input" id="table-input" placeholder="Стол №" value="${esc(table)}" />
        </div>
        <div class="chips">
          ${MENU.map(c => `<div class="chip ${c.cat === activeCat ? "active" : ""}" data-cat="${esc(c.cat)}">${esc(c.cat)}</div>`).join("")}
        </div>
        <div class="menu-scroll" id="menu-scroll">
          ${menuListHTML()}
        </div>
        ${cartCount() > 0 ? `
        <div class="cart-bar">
          <button class="cart-btn" id="open-cart">
            <span class="left">🧺 <span class="count">${cartCount()}</span> в корзине</span>
            <span>${fmt(cartTotal())} ₸</span>
          </button>
        </div>` : ""}
        ${overlay}
        ${toast ? `<div class="toast">${esc(toast)}</div>` : ""}
      </div>
    `;
    bindCustomerEvents();
    if (screen === "confirm") renderQR();
  }

  function roleSwitchHTML() {
    return `
      <div class="role-switch">
        <button data-role="customer" class="${mode === "customer" ? "active" : ""}">Клиент</button>
        <button data-role="waiter" class="${mode === "waiter" ? "active" : ""}">Официант</button>
      </div>`;
  }

  function menuListHTML() {
    const q = query.trim().toLowerCase();
    const cats = q
      ? MENU.map(c => ({ ...c, items: c.items.filter(it => it.n.toLowerCase().includes(q)) })).filter(c => c.items.length)
      : MENU.filter(c => c.cat === activeCat);

    if (!cats.length) return `<div class="empty-note">Ничего не найдено</div>`;

    return cats.map(c => `
      <div class="category-block">
        <div class="category-title">${esc(c.cat)}<span class="skewer"></span>${c.unit ? `<span class="category-unit">${esc(c.unit)}</span>` : ""}</div>
        ${c.items.map(it => itemRowHTML(it)).join("")}
      </div>
    `).join("");
  }

  function itemRowHTML(it) {
    const qty = cart[it.id] || 0;
    return `
      <div class="item-row">
        <div class="item-info">
          <div class="item-name">${esc(it.n)}${it.unit ? ` <span style="color:var(--muted);font-weight:400;">· ${esc(it.unit)}</span>` : ""}</div>
          ${it.note ? `<div class="item-note">${esc(it.note)}</div>` : ""}
          <div class="item-price">${fmt(it.p)} ₸</div>
        </div>
        <div class="qty-controls">
          ${qty > 0 ? `<button data-remove="${it.id}">–</button><span class="qty-num">${qty}</span>` : ""}
          <button class="add" data-add="${it.id}">+</button>
        </div>
      </div>
    `;
  }

  function cartOverlayHTML() {
    const ids = Object.keys(cart);
    return `
      <div class="overlay">
        <div class="overlay-head">
          <button class="back" id="close-cart">←</button>
          <div class="title">Ваш заказ</div>
        </div>
        <div class="overlay-body">
          <div class="note-banner">Заказ сохранится под уникальным кодом, который увидит официант при сканировании QR — обслуживание 0%, цены указаны итоговые.</div>
          ${ids.length ? ids.map(id => {
            const it = findItem(id);
            return `<div class="cart-row">
              <div class="name">${esc(it.n)}</div>
              <div class="qty-controls">
                <button data-remove="${id}">–</button>
                <span class="qty-num">${cart[id]}</span>
                <button class="add" data-add="${id}">+</button>
              </div>
              <div class="line-total">${fmt(it.p * cart[id])} ₸</div>
            </div>`;
          }).join("") : `<div class="empty-note">Корзина пуста</div>`}

          ${ids.length ? `
          <div class="totals">
            <div class="row grand"><span>Итого</span><span class="val">${fmt(cartTotal())} ₸</span></div>
          </div>
          <div class="field">
            <label>Номер стола</label>
            <input type="text" id="table-input-2" placeholder="Например, 12" value="${esc(table)}" />
          </div>
          <button class="primary-btn" id="submit-order">Оформить заказ</button>
          ` : ""}
        </div>
      </div>
    `;
  }

  function confirmOverlayHTML() {
    if (!lastOrder) return "";
    const o = lastOrder;
    const time = new Date(o.createdAt).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
    return `
      <div class="overlay">
        <div class="overlay-head">
          <button class="back" id="close-confirm">←</button>
          <div class="title">Заказ оформлен</div>
        </div>
        <div class="overlay-body">
          <div class="ticket">
            <div class="stamp">Код заказа</div>
            <div class="code">${esc(o.code)}</div>
            <div class="meta">Стол ${esc(o.table)} · ${time}</div>
            <div class="qr-wrap"><div id="qr-target"></div></div>
            <div class="hint">Покажите этот QR официанту — он отсканирует его на своём устройстве и увидит весь заказ.</div>
            <div class="receipt-list">
              ${o.items.map(it => `<div class="r-row"><span class="n">${it.qty} × ${esc(it.n)}</span><span>${fmt(it.p * it.qty)} ₸</span></div>`).join("")}
              <div class="r-row" style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:700;color:var(--cream);">
                <span>Итого</span><span>${fmt(o.total)} ₸</span>
              </div>
            </div>
          </div>
          <button class="ghost-btn" id="new-order">Сделать новый заказ</button>
        </div>
      </div>
    `;
  }

  function bindCustomerEvents() {
    root.querySelectorAll("[data-role]").forEach(b => b.onclick = () => {
      mode = b.dataset.role;
      if (mode === "waiter") stopScanSafe();
      render();
    });
    root.querySelectorAll(".chip").forEach(c => c.onclick = () => { activeCat = c.dataset.cat; query = ""; render(); });
    const search = root.querySelector("#search-input");
    if (search) search.oninput = (e) => { query = e.target.value; render(); setTimeout(()=>{ const s=root.querySelector("#search-input"); if(s){ s.focus(); s.selectionStart=s.selectionEnd=s.value.length; } },0); };
    const tinput = root.querySelector("#table-input");
    if (tinput) tinput.oninput = (e) => { table = e.target.value; };
    const tinput2 = root.querySelector("#table-input-2");
    if (tinput2) tinput2.oninput = (e) => { table = e.target.value; };

    root.querySelectorAll("[data-add]").forEach(b => b.onclick = () => addItem(b.dataset.add));
    root.querySelectorAll("[data-remove]").forEach(b => b.onclick = () => removeItem(b.dataset.remove));

    const openCart = root.querySelector("#open-cart");
    if (openCart) openCart.onclick = () => { screen = "cart"; render(); };
    const closeCart = root.querySelector("#close-cart");
    if (closeCart) closeCart.onclick = () => { screen = "menu"; render(); };
    const closeConfirm = root.querySelector("#close-confirm");
    if (closeConfirm) closeConfirm.onclick = () => { screen = "menu"; render(); };
    const submit = root.querySelector("#submit-order");
    if (submit) submit.onclick = submitOrder;
    const newOrder = root.querySelector("#new-order");
    if (newOrder) newOrder.onclick = () => { screen = "menu"; lastOrder = null; render(); };
  }

  function stopScanSafe() { try { stopScan(); } catch(e) {} }

  function renderWaiter() {
    root.innerHTML = `
      <div class="app-shell">
        <div class="topbar">
          <div class="brand">
            <div class="name">Miran</div>
            <div class="tag">Кабинет официанта</div>
          </div>
          ${roleSwitchHTML()}
        </div>
        <div class="overlay-body" style="padding:16px 18px 24px;">
          <div class="note-banner">Отсканируйте QR-код с экрана клиента камерой устройства, или введите код заказа вручную.</div>

          <div class="waiter-search">
            <input type="text" id="waiter-code" placeholder="КОД ЗАКАЗА" value="${esc(waiterCode)}" maxlength="5" />
            <button id="waiter-find">Найти</button>
          </div>

          ${!scanning ? `<button class="ghost-btn" id="start-scan">📷 Сканировать QR камерой</button>` : `<button class="ghost-btn" id="stop-scan">Остановить сканирование</button>`}

          ${scanning ? `
          <div class="scan-box">
            <video id="scan-video" playsinline muted></video>
            <div class="frame"></div>
          </div>
          <canvas id="scan-canvas" style="display:none;"></canvas>
          ` : ""}
          ${scanStatus ? `<div class="scan-status">${esc(scanStatus)}</div>` : ""}

          ${waiterError ? `<div class="scan-status" style="color:var(--paprika-2);">${esc(waiterError)}</div>` : ""}
          ${waiterOrder ? waiterOrderCardHTML(waiterOrder) : ""}
        </div>
        ${toast ? `<div class="toast">${esc(toast)}</div>` : ""}
      </div>
    `;
    bindWaiterEvents();
  }

  function waiterOrderCardHTML(o) {
    const time = new Date(o.createdAt).toLocaleString("ru-RU", { hour: "2-digit", minute: "2-digit", day: "2-digit", month: "2-digit" });
    return `
      <div class="order-card">
        <div class="oc-head">
          <span class="oc-code">${esc(o.code)}</span>
          <span class="oc-time">${time}</span>
        </div>
        <div class="oc-table">Стол ${esc(o.table)}</div>
        <div class="status-pill">${esc(o.status || "Принят")}</div>
        <div class="receipt-list">
          ${o.items.map(it => `<div class="r-row"><span class="n">${it.qty} × ${esc(it.n)}</span><span>${fmt(it.p * it.qty)} ₸</span></div>`).join("")}
          <div class="r-row" style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:700;color:var(--cream);">
            <span>Итого</span><span>${fmt(o.total)} ₸</span>
          </div>
        </div>
      </div>
    `;
  }

  function bindWaiterEvents() {
    root.querySelectorAll("[data-role]").forEach(b => b.onclick = () => {
      stopScanSafe();
      mode = b.dataset.role;
      render();
    });
    const codeInput = root.querySelector("#waiter-code");
    if (codeInput) {
      codeInput.oninput = (e) => { waiterCode = e.target.value.toUpperCase(); };
      codeInput.onkeydown = (e) => { if (e.key === "Enter") lookupOrder(waiterCode); };
    }
    const findBtn = root.querySelector("#waiter-find");
    if (findBtn) findBtn.onclick = () => lookupOrder(waiterCode);

    const startBtn = root.querySelector("#start-scan");
    if (startBtn) startBtn.onclick = startScan;
    const stopBtn = root.querySelector("#stop-scan");
    if (stopBtn) stopBtn.onclick = () => { stopScan(); render(); };
  }

  render();
})();
</script>
